<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 1152" role="img" aria-label="Minh họa hoa hướng dương chúc mừng ngày 20/10">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF3DC"/>
      <stop offset="0.55" stop-color="#F9E4B8"/>
      <stop offset="1" stop-color="#EAE2B8"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#FFF3C4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#D98F2E"/>
      <stop offset="0.5" stop-color="#F9C846"/>
      <stop offset="1" stop-color="#FFDE7A"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.42" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#7A5A38"/>
      <stop offset="0.55" stop-color="#65483A"/>
      <stop offset="1" stop-color="#382517"/>
    </radialGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3F6B35"/>
      <stop offset="0.5" stop-color="#587B42"/>
      <stop offset="1" stop-color="#6E9A55"/>
    </linearGradient>
  </defs>

  <rect width="864" height="1152" fill="url(#sky)"/>
  <circle cx="432" cy="330" r="330" fill="url(#sunGlow)"/>

  <!-- mây mềm -->
  <g fill="#FFF8E9" opacity="0.7">
