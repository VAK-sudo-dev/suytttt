    <ellipse cx="290" cy="160" rx="90" ry="26"/>
    <ellipse cx="660" cy="240" rx="120" ry="30"/>
  </g>

  <!-- thân và lá -->
  <path d="M432 640 C 420 800 438 920 432 1050" stroke="url(#stem)" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M430 810 C 360 790 320 760 300 700 C 380 700 420 740 430 810 Z" fill="#4E7B42"/>
  <path d="M434 900 C 510 880 556 846 576 782 C 492 784 448 828 434 900 Z" fill="#587B42"/>

  <!-- cánh hoa: hai vòng -->
  <g transform="translate(432 480)">
    <g fill="url(#petal)" stroke="#C77F26" stroke-width="2">
      <g transform="rotate(11)"><ellipse cx="0" cy="-210" rx="34" ry="86"/></g>
      <g transform="rotate(34)"><ellipse cx="0" cy="-210" rx="34" ry="86"/></g>
      <g transform="rotate(56)"><ellipse cx="0" cy="-210" rx="34" ry="86"/></g>
      <g transform="rotate(79)"><ellipse cx="0" cy="-210" rx="34" ry="86"/></g>
      <g transform="rotate(101)"><ellipse cx="0" cy="-210" rx="34" ry="86"/></g>
      <g transform="rotate(124)"><ellipse cx="0" cy="-210" rx="34" ry="86"/></g>
      <g transform="rotate(146)"><ellipse cx="0" cy="-210" rx="34" ry="86"/></g>
      <g transform="rotate(169)"><ellipse cx="0" cy="-210" rx="34" ry="86"/></g>
      <g transform="rotate(191)"><ellipse cx="0" cy="-210" rx="34" ry="86"/></g>
      <g transform="rotate(214)"><ellipse cx="0" cy="-210" rx="34" ry="86"/></g>
      <g transform="rotate(236)"><ellipse cx="0" cy="-210" rx="34" ry="86"/></g>
      <g transform="rotate(259)"><ellipse cx="0" cy="-210" rx="34" ry="86"/></g>
      <g transform="rotate(281)"><ellipse cx="0" cy="-210" rx="34" ry="86"/></g>
      <g transform="rotate(304)"><ellipse cx="0" cy="-210" rx="34" ry="86"/></g>
      <g transform="rotate(326)"><ellipse cx="0" cy="-210" rx="34" ry="86"/></g>
      <g transform="rotate(349)"><ellipse cx="0" cy="-210" rx="34" ry="86"/></g>
    </g>
    <!-- đĩa hạt -->
    <circle cx="0" cy="0" r="128" fill="url(#disc)"/>
    <g fill="#8A6A45" opacity="0.55">
      <circle cx="-52" cy="-38" r="9"/><circle cx="-16" cy="-58" r="9"/>
      <circle cx="26" cy="-52" r="9"/><circle cx="58" cy="-22" r="9"/>
      <circle cx="52" cy="26" r="9"/><circle cx="14" cy="54" r="9"/>
      <circle cx="-34" cy="44" r="9"/><circle cx="-64" cy="8" r="9"/>
      <circle cx="-6" cy="-4" r="9"/><circle cx="30" cy="6" r="9"/>
      <circle cx="-30" cy="-6" r="9"/><circle cx="4" cy="28" r="9"/>
    </g>
    <circle cx="0" cy="0" r="128" fill="none" stroke="#E8A93A" stroke-width="6" opacity="0.6"/>
  </g>

  <!-- cánh hoa rơi -->
  <g fill="#F9C846" opacity="0.8">
    <ellipse cx="180" cy="560" rx="12" ry="22" transform="rotate(24 180 560)"/>
    <ellipse cx="700" cy="500" rx="10" ry="20" transform="rotate(-30 700 500)"/>
    <ellipse cx="640" cy="700" rx="9" ry="18" transform="rotate(40 640 700)"/>
  </g>

  <text x="432" y="1090" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" letter-spacing="10" fill="#65483A">20 · 10</text>
